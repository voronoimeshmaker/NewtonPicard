mesh:
  type: cartesian_square
  target_cells: 21760
  n_generators: 21760
  n_per_direction: 256
  n_per_direction_y: 85
  domain: [-15.0, 15.0, -5.0, 5.0]
  hilbert_reorder: false
  reordering: natural
  random_seed: 12345
  families: [cartesian, hexagonal, random]
  nominal_nx: 256
  nominal_ny: 85

sampling:
  sample_count: 2000
  seed: 20260914
  alpha_min: 1.0e-4
  alpha_max: 9.999e-1
  theta_min_degrees: -10.0
  theta_max_degrees: 10.0
  rho_strata_edges: [0.70, 0.90, 0.98, 1.02, 1.10, 1.30]

calibration:
  alpha: 0.225
  theta_degrees: 5.7

source:
  gradient: wlsqr
  weighting: inverse_distance_squared
  regularisation_delta: 1.0e-10
  derivative: adolc

fadeev:
  alpha: 0.225
  theta_degrees: 5.7

solver:
  nonlinear: picard
  linear: petsc
  max_iter: 5000
  tolerance_relative: 1.0e-10
  tolerance_absolute: 1.0e-12
  relaxation_omega: 1.0
  rhs_constant: 1.0
  source_regularisation_delta: 1.0e-10
  diagonal_shift: 0.0
  initial_guess: reference_perturbed
  perturbation_amplitude: 1.0e-4
  perturbation_type: deterministic_shape

spectral:
  requested_eigenpairs: 8
  tolerance: 1.0e-11
  max_iterations: 3000

study:
  alpha: 0.225
  theta_degrees: 5.7
  nonlinearity_scale: 1.0
  random_mesh_seed: 12345
  finite_difference_scale: 1.0
  jacobian_stencil_radius: 1
  repair_stationary_points: false
  recovery_sweeps: 5
  requested_eigenpairs: 8
  eps_tolerance: 1.0e-11
  eps_max_iterations: 3000
  newton_damping: 1.0
  reference_relative_tolerance: 1.0e-6
  progress_every: 100

comparison:
  picard_if_rho_below: 1.0
  divergence_factor: 1.0e8
  compute_unexpected_picard_final_rho: true

krylov:
  relative_tolerance: 1.0e-2
  absolute_tolerance: 1.0e-12
  max_iterations: 50

output:
  directory: Result
