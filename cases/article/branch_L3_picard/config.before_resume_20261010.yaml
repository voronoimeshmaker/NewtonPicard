mesh:
  type: cartesian_square
  target_cells: 87552
  n_generators: 87552
  n_per_direction: 512
  n_per_direction_y: 171
  domain:
  - -15.0
  - 15.0
  - -5.0
  - 5.0
  hilbert_reorder: false
  reordering: natural
  random_seed: 12345
  families:
  - cartesian
  - hexagonal
  - random
  nominal_nx: 512
  nominal_ny: 171
sampling:
  sample_count: 100
  seed: 20260914
  alpha_min: 0.0001
  alpha_max: 0.9999
  theta_min_degrees: -10.0
  theta_max_degrees: 10.0
  rho_strata_edges:
  - 0.7
  - 0.9
  - 0.98
  - 1.02
  - 1.1
  - 1.3
calibration:
  alpha: 0.225
  theta_degrees: 5.7
source:
  gradient: wlsqr
  weighting: inverse_distance_squared
  regularisation_delta: 1.0e-10
  derivative: adolc
fadeev:
  alpha: 0.225
  theta_degrees: 5.7
solver:
  nonlinear: picard
  linear: petsc
  max_iter: 5000
  tolerance_relative: 1.0e-10
  tolerance_absolute: 1.0e-12
  relaxation_omega: 1.0
  rhs_constant: 1.0
  source_regularisation_delta: 1.0e-10
  diagonal_shift: 0.0
  initial_guess: reference_perturbed
  perturbation_amplitude: 0.0001
  perturbation_type: deterministic_shape
spectral:
  requested_eigenpairs: 8
  tolerance: 1.0e-11
  max_iterations: 3000
study:
  alpha: 0.225
  theta_degrees: 5.7
  nonlinearity_scale: 1.0
  random_mesh_seed: 12345
  finite_difference_scale: 1.0
  jacobian_stencil_radius: 1
  repair_stationary_points: false
  recovery_sweeps: 5
  requested_eigenpairs: 8
  eps_tolerance: 1.0e-11
  eps_max_iterations: 3000
  newton_damping: 1.0
  reference_relative_tolerance: 1.0e-06
  progress_every: 100
comparison:
  picard_if_rho_below: 1.0
  divergence_factor: 1.0e8
  compute_unexpected_picard_final_rho: true
krylov:
  relative_tolerance: 0.01
  absolute_tolerance: 1.0e-12
  max_iterations: 50
output:
  directory: Result
methods:
- WLSQR
diagnostics:
  reference_rho: false
  initial_rho: false
  jacobian_assembly: true
  regularisation_floor: true
analysis:
  rho_bins_by_target: true
