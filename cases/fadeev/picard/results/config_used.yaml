mesh:
  type: uniform_internal
  n_generators: 256
  n_per_direction: 16
  n_per_direction_y: 16
  random_seed: 12345
  domain: [-1, 1, -1, 1]
  hilbert_reorder: false
  reordering: natural
solver:
  nonlinear: picard
  linear: cholesky_sparse
  max_iter: 200
  tolerance_relative: 9.9999999999999998e-13
  tolerance_absolute: 1e-13
  relaxation_omega: 1
  rhs_constant: 1
  source_regularisation_delta: 1e-10
  diagonal_shift: 0
  initial_guess: zero
  perturbation_amplitude: 0
  perturbation_type: gaussian
newton:
  jacobian: adolc
  linesearch: true
  linesearch_max_iter: 10
  linesearch_reduction: 0.5
petsc:
  ksp_type: preonly
  pc_type: cholesky
  mat_solver_type: mumps
  mumps_reorder: pord
  mumps_icntl_14: 20
benchmark:
  type: fadeev
  fadeev_epsilon: 0.10000000000000001
  fadeev_psi0: 1
  fadeev_k: 1
  fadeev_alpha: 0.22500000000000001
  fadeev_theta_degrees: 5.7000000000000002
  compute_error: true
  error_norms:
    - L1
    - L2
    - Linf
  kappa_island_threshold: 100
convergence_study:
  enabled: true
  n_generators_sequence:
    - 64
    - 256
    - 1024
  output_csv: convergence_study.csv
gradient_analysis:
  enabled: true
  top_k: 20
  quantities:
    - grad_psi
    - grad_psi_inv
    - source_term
  min_distance: 2
  grad_critical_threshold: 0.01
  output:
    format: both
    filename_extrema: gradient_extrema.csv
    filename_critical: critical_points.csv
output:
  format: csv
  write_solution: true
  write_error: true
  timing_report: true
  timing_components: true
